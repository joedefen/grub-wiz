[build-system]
# flit_core 3.12 is the first release with PEP 639 support
# (SPDX license expressions and [project] license-files).
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "grub-wiz"
# The release number lives in `grub_wiz/__init__.py` (`__version__`).  This
# table only declares where it comes from, so the build backend, `bless` and
# `grub-wiz --version` all report the same string.
dynamic = ["version"]
readme = "README.md"
description = "Grub config assistant"
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ruamel.yaml>=0.18.17",
    "console-window==2.1.3",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Boot",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# What the test and release gates need on the interpreter that runs them.
# `bless` refuses to start unless twine>=7 and packaging>=26 are installed, and
# it runs pytest with --cov, so those floors belong here too.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=7",
    "packaging>=26",
    # The inspector and the identity test parse pyproject.toml with tomllib,
    # which entered the standard library in 3.11; this project still supports
    # 3.10.
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/grub-wiz"

[project.scripts]
grub-wiz = "grub_wiz.main:run_cli"

[tool.bless]
# Both branches exist locally and on origin.  `bless` leaves whichever one lags
# fast-forwarded onto the other before tagging, so a release always leaves them
# at one commit.
branches = ["main", "dev"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the classic Pyflakes/pycodestyle subset: the project intentionally
# disables pylint's line-too-long check, and enabling every rule family would
# drown the signal in pre-existing findings.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
# Pin the measured package so the number the release gate prints does not
# depend on where pytest was started.
source = ["grub_wiz"]
omit = ["tests/*"]

[tool.coverage.report]
# Measured just above this when the release gate was adopted; the floor is a
# ratchet against new code arriving without a test, not a target to optimise.
# Raise it when the number rises, never lower it.
fail_under = 60
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

