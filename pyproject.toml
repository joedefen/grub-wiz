[build-system]
# flit_core 3.12 is the first release with PEP 639 support
# (SPDX license expressions and [project] license-files).
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "grub-wiz"
version = "2.0.0"
readme = "README.md"
description = "Grub config assistant"
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ruamel.yaml>=0.18.17",
    "console-window==2.1.2",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Boot",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "mypy>=1.10",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/grub-wiz"

[project.scripts]
grub-wiz = "grub_wiz.main:run_cli"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the classic Pyflakes/pycodestyle subset: the project intentionally
# disables pylint's line-too-long check, and enabling every rule family would
# drown the signal in pre-existing findings.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

