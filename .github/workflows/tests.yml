name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    # Pinned instead of ubuntu-latest so the Oct 2026 migration of the
    # "latest" label to Ubuntu 26 cannot change the toolchain under us.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
          # grub-wiz supports Python 3.10+, which is the floor imposed by
          # console-window==2.2.2 (Requires-Python: >=3.10) and is declared in
          # pyproject.toml (audit item C3).  Test the floor, every supported
          # minor, and the current release.
          python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The same three commands `./bless` runs, in the same order, on the same
      # interpreter -- never an equivalent.
      - name: Lint
        run: python -m ruff check .

      - name: Byte-compile sources
        run: |
          python -m compileall -q grub_wiz tests
          python -m py_compile runner

      - name: Run tests with coverage
        run: python -m pytest -q --cov=grub_wiz --cov-report=term-missing

  build:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # The same inspector `./bless` refuses to upload without, so CI and the
      # release gate cannot disagree about what a good distribution is.
      - name: Inspect distributions
        run: python tests/inspect_dist.py dist/*.whl dist/*.tar.gz
